services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sesacre-laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf
    networks:
      - sesacre-network

  nginx:
    image: nginx:1.25-alpine
    container_name: sesacre-laravel-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sesacre-network
    depends_on:
      - app

networks:
  sesacre-network:
    external: true
